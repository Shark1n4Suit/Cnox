[package]
name = "runner"
version = "0.1.0"
edition = "2021"
description = "SAIC (Secure AI Container) file runner - reads and validates .saic files"
authors = ["Benjamin Morin <your-email@example.com>"]
license = "MIT"

[dependencies]
# Command-line argument parsing with derive macros for clean subcommand handling
clap = { version = "4.5", features = ["derive"] }

# Structured logging framework for audit trail and debugging
tracing = "0.1"

# Console logger implementation for tracing framework
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# JSON deserialization for SAIC manifest parsing
serde_json = "1.0"

# Intel OpenVINO toolkit for AI model inference execution
# Uses runtime-linking to allow building without OpenVINO installed at compile time
openvino = { version = "0.7", features = ["runtime-linking"] }

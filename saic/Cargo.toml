[package]
name = "saic"
version = "0.5.0-beta"
edition = "2021"
authors = ["Benjamin Morin <benjamin@saic.ai>"]
description = "Secure AI Container - Universal binary container for AI models"
license = "MIT"
repository = "https://github.com/saic-ai/saic"
keywords = ["ai", "ml", "container", "security", "optimization", "inference"]
categories = ["artificial-intelligence", "system-programming", "security"]
readme = "README.md"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[dependencies]
# CLI and argument parsing
clap = { version = "4.4", features = ["derive"] }

# Serialization and deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num_cpus = "1.16"
prost = "0.12"
bytes = "1.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Performance and concurrency
rayon = { version = "1.8", optional = true }
crossbeam = { version = "0.8", optional = true }

# File handling and memory mapping
memmap2 = "0.9"
walkdir = "2.4"
glob = "0.3"
tempfile = "3.8"

# Async runtime
tokio = { version = "1.35", features = ["full"], optional = true }

# Configuration
config = "0.14"
toml = "0.8"

# Time and date handling
chrono = { version = "0.4", features = ["serde"] }

# Compression
flate2 = "1.0"

# Platform-specific
libc = "0.2"
windows-sys = { version = "0.48", features = ["Win32_System_Memory"] }

# Security and cryptography
sha2 = "0.10"
aes = { version = "0.8", optional = true }
hmac = { version = "0.12", optional = true }

[dev-dependencies]
tempfile = "3.8"
proptest = "1.3"
criterion = "0.5"
assert_fs = "1.1"
predicates = "3.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[build-dependencies]
cc = "1.0"

[features]
default = ["cli", "format", "packager"]
cli = []
format = []
packager = []
runtime = []
backends = []
openvino = []
tensorrt = []
fallback = []
security = ["aes", "hmac"]
performance = ["rayon", "crossbeam"]
full = ["cli", "format", "packager", "runtime", "backends", "security", "performance"]

[[bin]]
name = "saic"
path = "src/main.rs"
required-features = ["cli"]

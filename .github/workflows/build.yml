name: Build and Test

on:
  push:
    branches: [ main, prod ]
  pull_request:
    branches: [ main, prod ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            coelanox/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Test
        run: |
          cd coelanox
          cargo test

      - name: Format
        run: |
          cd coelanox
          cargo fmt --all -- --check

      - name: Clippy
        run: |
          cd coelanox
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Audit
        run: |
          cargo install cargo-audit --locked --quiet
          cd coelanox
          cargo audit

      - name: Build
        run: |
          cd coelanox
          cargo build --release -p coelanox-cli

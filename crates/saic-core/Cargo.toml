[package]
name = "saic-core"
version = "0.5.0"
edition = "2021"
description = "Core library for SAIC (Secure AI Container)"
license = "BSL-1.1"
repository = "https://github.com/coelanox/saic"
keywords = ["ai", "container", "inference", "optimization"]
categories = ["science", "system-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
thiserror = "1.0"
num_cpus = "1.16"
anyhow = { workspace = true }
tempfile = "3.0"
md5 = "0.7"
parking_lot = "0.12"
once_cell = "1.18"
rayon = "1.7"

[dev-dependencies]
tempfile = "3.0" 
[package]
name = "coelanox-executor"
version = "0.7.1"
edition = "2021"
authors = ["Benjamin Morin <benjamin@coelanox.ai>"]
description = "CLF mini-executor: runs multi-blob containers via execution plan (graph walk + kernel dispatch)"

[dependencies]
coelanox-core = { path = "../coelanox-core" }
# CLF SIMD kernels (Rust symbols) for the optional \"simd-symbols\" backend.
# When using blob execution, the executor calls container code via CLFE 6-arg ABI.
clf-kernels-simd = { path = "../../clf/kernels/simd", default-features = true }

[package]
name = "coelanox-core"
version = "0.7.0"
edition = "2021"
authors = ["Benjamin Morin <benjamin@coelanox.ai>"]
description = "COELANOX Core Library - Shared data structures and utilities"
license = "Proprietary"
repository = "https://github.com/coelanox-ai/coelanox"

[dependencies]
serde = { workspace = true }
serde_json = "1.0"
bincode = "1.3"
bytes = "1.5"
libc = "0.2"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = { workspace = true }
thiserror = "1.0"
anyhow = "1.0"
prost = "0.12"
prost-types = "0.12"
num_cpus = "1.16"
# CPU model / RAM for `coelanox env` (Windows registry-free path; consistent with Linux/macOS)
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
matrixmultiply = { version = "0.3", features = ["threading"] }
rayon = "1.8"
zerocopy = { workspace = true }

syntax = "proto3";

package onnx;

// Versioning
message OperatorSetId {
  string domain = 1;
  int64 version = 2;
}

// For very large tensors, we may want to store them in chunks, where each chunk would be
// an instance of this message, and then concatenated according to the chunk_id field
// in the order they appear in the chunks field.
message StringStringEntryProto {
  string key = 1;
  string value = 2;
}

message TensorAnnotation {
  string tensor_name = 1;
  repeated StringStringEntryProto quant_parameter_tensor_names = 2;
}

// Graphs
//
// A graph defines the computational logic of a model and is comprised of a set of
// nodes that form a directed acyclic graph based on their inputs and outputs.
// This is the equivalent of the "network" or "graph" in many deep learning
// frameworks.
message GraphProto {
  repeated NodeProto node = 1;
  string name = 2; // namespace Graph
  repeated TensorProto initializer = 5;
  string doc_string = 10;
  repeated ValueInfoProto input = 11;
  repeated ValueInfoProto output = 12;
  repeated ValueInfoProto value_info = 13;
  repeated TensorAnnotation quantization_annotation = 14;
}

// Tensors
//
// A serialized tensor value.
message TensorProto {
  enum DataType {
    UNDEFINED = 0;
    // Basic types.
    FLOAT = 1;   // float
    UINT8 = 2;   // uint8_t
    INT8 = 3;    // int8_t
    UINT16 = 4;  // uint16_t
    INT16 = 5;   // int16_t
    INT32 = 6;   // int32_t
    INT64 = 7;   // int64_t
    STRING = 8;  // string
    BOOL = 9;    // bool
    // IEEE754 half-precision floating-point format (16 bits wide).
    // This format has 1 sign bit, 5 exponent bits, and 10 mantissa bits.
    FLOAT16 = 10;
    DOUBLE = 11;
    UINT32 = 12;
    UINT64 = 13;
    COMPLEX64 = 14;     // complex with float32 real and imaginary parts
    COMPLEX128 = 15;    // complex with float64 real and imaginary parts
    // Non-IEEE floating-point format based on IEEE754 single-precision
    // floating-point number truncated to 16 bits.
    // This format has 1 sign bit, 8 exponent bits, and 7 mantissa bits.
    BFLOAT16 = 16;
  }
  DataType data_type = 1;
  // The shape of the tensor.
  repeated int64 dims = 2;
  // For float and complex64 values
  // Complex64 tensors are encoded as a single array of floats,
  // with the real components appearing in odd positions and imaginary
  // components appearing in even positions. (e.g., [1.0 + 2.0i, 3.0 + 4.0i]
  // is encoded as [1.0, 2.0 ,3.0 ,4.0]
  // When this field is present, the data_type field MUST be FLOAT or COMPLEX64.
  repeated float float_data = 4 [packed = true];
  // For int32, uint8, int8, uint16, int16, bool, and float16 values
  // float16 values must be bit-wise converted to an uint16_t prior
  // to writing to the protobuf, see the convert_float_to_float16 function
  // in onnx/onnx/helper.py for an example of how to do this.
  repeated int32 int32_data = 5 [packed = true];
  // For strings.
  // Each element of string_data is a UTF-8 encoded Unicode string.
  // When this field is present, the data_type field MUST be STRING.
  repeated bytes string_data = 6;
  // For int64.
  repeated int64 int64_data = 7 [packed = true];
  // Optionally, a name for the tensor.
  string name = 8; // namespace Value
  // A human-readable documentation for this tensor. Markdown is allowed.
  string doc_string = 12;
  // Serializations can either use one of the fields above, or use this
  // raw bytes field. The only exception is the string case, where one is
  // required to store the content in the repeated bytes string_data field.
  // When this raw_data field is used to store tensor value, elements MUST
  // be stored in as a contiguous C array in row-major order. For example,
  // for a 2x3 matrix, the elements would be stored as:
  // [1, 2, 3, 4, 5, 6]
  // If the tensor is not dense, the elements are stored in the order
  // specified by the indices field.
  bytes raw_data = 9;
  // For double
  repeated double double_data = 10 [packed = true];
  // For uint64
  repeated uint64 uint64_data = 11 [packed = true];
}

// Defines a tensor shape. A dimension can be either a constant value or
// a symbolic variable. A symbolic variable represents an unknown dimension.
message TensorShapeProto {
  message Dimension {
    oneof value {
      int64 dim_value = 1;
      string dim_param = 2;   // namespace Shape
    };
  };
  repeated Dimension dim = 1;
}

// Types
//
// The standard ONNX data types.
message TypeProto {
  message Tensor {
    // This field MUST be present for this version of the IR.
    int32 elem_type = 1;
    TensorShapeProto shape = 2;
  }
  Tensor tensor_type = 1;
  string denotation = 6;
}

// Operator Sets
//
// An OperatorSetIdProto is an immutable singleton that contains a set of
// operator definitions. All operator definitions in the set MUST have the
// same domain and version.
message OperatorSetIdProto {
  string domain = 1;
  int64 version = 2;
}

// Models
//
// ModelProto is a top-level file/container format for bundling a ML model and
// associating its computation graph with metadata.
//
// The semantics of the model are described by the associated GraphProto's.
// The version of the model is indicated by the ir_version field.
// The version of the ONNX OperatorSets used by the model is indicated by the
// opset_import field.
message ModelProto {
  // The version of the IR this model targets. See Version enum above.
  // This field MUST be present.
  int64 ir_version = 1;
  // The OperatorSets this model relies on.
  // All ModelProtos MUST have at least one entry that
  // specifies which version of the ONNX OperatorSet is
  // being imported.
  // All nodes in the ModelProto's graph MUST bind against the operator
  // defined by the referenced OperatorSets.
  repeated OperatorSetIdProto opset_import = 8;
  // The name of the framework or tool used to generate this model.
  // This field SHOULD be present to indicate which implementation/tool/framework
  // emitted the model.
  string producer_name = 2;
  // The version of the framework or tool used to generate this model.
  // This field SHOULD be present to indicate which implementation/tool/framework
  // emitted the model.
  string producer_version = 3;
  // Domain name of the model.
  // We use reverse domain names as name space indicators. For example:
  // `com.facebook.fair` or `com.microsoft.cognitiveservices`
  //
  // Together with `model_version` and GraphProto.name, this forms the unique identity of
  // the graph.
  string domain = 4;
  // The version of the graph encoded. See Version enum below to see which version
  // of the ONNX specification this graph conforms to.
  int64 model_version = 5;
  // A human-readable documentation for this model. Markdown is allowed.
  string doc_string = 6;
  // The parameterized graph that is evaluated to execute the model.
  GraphProto graph = 7;
  // Named metadata values; keys should be distinct.
  repeated StringStringEntryProto metadata_props = 14;
}

// Node
//
// Computation graphs are made up of a DAG of nodes, which represent what is
// commonly called a "layer" or "pipeline stage" in machine learning frameworks.
//
// For example, it can be a node of type "Conv" that takes in an image, a
// filter tensor and a bias tensor, and produces the convolved output.
message NodeProto {
  repeated string input = 1;    // namespace Value
  repeated string output = 2;   // namespace Value
  // An optional identifier for this node in a graph.
  // This field MAY be absent in top-level graph Inputs and Outputs.
  // This field MUST be present in all other cases.
  string name = 3;     // namespace Node
  // The symbolic identifier of the Operator to execute.
  string op_type = 4;  // namespace Operator
  // The domain of the OperatorSet that specifies the operator named in op_type.
  string domain = 7;   // namespace Domain
  // Additional named attributes.
  repeated AttributeProto attribute = 5;
  // A human-readable documentation for this node. Markdown is allowed.
  string doc_string = 6;
}

// ValueInfo
//
// Defines information on value, including both the data type and the shape.
message ValueInfoProto {
  // This field MUST be present for this version of the IR.
  string name = 1;     // namespace Value
  // This field MUST be present for this version of the IR.
  TypeProto r#type = 2;
  // A human-readable documentation for this value. Markdown is allowed.
  string doc_string = 3;
}

// Attributes
//
// A named attribute containing either singular float, int, string, graph, and tensor values,
// or repeated float, int, string, graph, and tensor values.
// An AttributeProto MUST contain the name field, and *only one* of the following content
// fields, effectively enforcing a C/C++ union equivalent.
message AttributeProto {
  enum AttributeType {
    UNDEFINED = 0;
    FLOAT = 1;
    INT = 2;
    STRING = 3;
    TENSOR = 4;
    GRAPH = 5;
    FLOATS = 6;
    INTS = 7;
    STRINGS = 8;
    TENSORS = 9;
    GRAPHS = 10;
  }
  string name = 1;
  AttributeType r#type = 21; // discriminator that indicates which field below is in use
  // Exactly one of the following fields must be present for this version of the IR
  float f = 2;               // float
  int64 i = 3;               // int
  bytes s = 4;               // UTF-8 string
  TensorProto t = 5;         // tensor value
  GraphProto g = 6;          // graph
  repeated float floats = 7; // list of floats
  repeated int64 ints = 8;   // list of ints
  repeated bytes strings = 9; // list of UTF-8 strings
  repeated TensorProto tensors = 10; // list of tensors
  repeated GraphProto graphs = 11; // list of graph
}

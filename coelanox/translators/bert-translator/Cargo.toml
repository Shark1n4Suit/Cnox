[package]
name = "bert-translator"
version = "0.1.0"
edition = "2021"
authors = ["Benjamin Morin <benjamin@coelanox.ai>"]
description = "COELANOX BERT Translator - Specialized BERT ONNX to UniversalIR converter"
license = "MIT"
repository = "https://github.com/coelanox-ai/coelanox"

[lib]
crate-type = ["rlib"]

[dependencies]
prost = "0.13"
coelanox-core = { path = "../../coelanox-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"


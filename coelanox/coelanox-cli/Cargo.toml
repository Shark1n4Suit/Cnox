[package]
name = "coelanox-cli"
version = "0.7.0"
edition = "2021"
description = "Coelanox command-line interface"
authors = ["Benjamin Morin <benjamin.morin@example.com>"]
license = "Proprietary"
repository = "https://github.com/benjamin-morin/coelanox"

[[bin]]
name = "coelanox"
path = "src/main.rs"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(backtrace)"] }

[features]
default = []

[dependencies]
coelanox-core = { path = "../coelanox-core" }
coelanox-executor = { path = "../coelanox-executor" }
coelanox-packager = { path = "../coelanox-packager" }
coelanox-orchestrator = { path = "../coelanox-orchestrator" }
coelanox-ipc = { path = "../coelanox-ipc" }
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"

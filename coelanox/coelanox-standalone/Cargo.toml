[package]
name = "coelanox-standalone"
version = "0.7.0"
edition = "2021"
description = "Minimal entry point to load and run a single COELANOX container (no CLI, no multi-container)"
authors = ["Benjamin Morin <benjamin.morin@example.com>"]
license = "Proprietary"
repository = "https://github.com/benjamin-morin/coelanox"

[[bin]]
name = "coelanox-run"
path = "src/main.rs"

[lib]
name = "coelanox_standalone"
path = "src/lib.rs"

[dependencies]
coelanox-core = { path = "../coelanox-core" }
coelanox-orchestrator = { path = "../coelanox-orchestrator" }
coelanox-ipc = { path = "../coelanox-ipc" }
clap = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"

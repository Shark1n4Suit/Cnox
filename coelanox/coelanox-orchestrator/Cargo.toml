[package]
name = "coelanox-orchestrator"
version = "0.7.5"
edition = "2021"
description = "Coelanox orchestrator - routes input to containers, manages lifecycle"
authors = ["Benjamin Morin <benjamin.morin@example.com>"]
license = "Proprietary"
repository = "https://github.com/benjamin-morin/coelanox"

[features]
default = []

[dependencies]
coelanox-core = { path = "../coelanox-core" }
coelanox-executor = { path = "../coelanox-executor" }
coelanox-clf = { path = "../coelanox-clf" }
bincode = "1.3"
libc = "0.2"
windows-sys = { version = "0.60", features = ["Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { workspace = true }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
rayon = "1.7"
num_cpus = "1.0"
memmap2 = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
coelanox-packager = { path = "../coelanox-packager" }
tempfile = "3.8"

[workspace]
members = [
    "crates/saic-core",
    "crates/saic-packager", 
    "crates/saic-runner",
    "crates/saic-inference"
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
memmap2 = "0.9"
thiserror = "1.0"
anyhow = "1.0" 